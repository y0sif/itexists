name: Feature request
description: Suggest a change to how itexists searches or reports
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to check, and where itexists fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
